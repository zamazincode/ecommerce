name: API

on:
    push:
        branches: [main, develop]
        paths: ["api/**", ".github/workflows/api.yml"]
    pull_request:
        branches: [main, develop]
        paths: ["api/**", ".github/workflows/api.yml"]

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        # Testcontainers Docker gerektirir; ubuntu-latest runner'ında hazır geliyor.

        steps:
            - uses: actions/checkout@v4

            - name: .NET kurulumu
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "10.0.x"

            - name: NuGet cache
              uses: actions/cache@v4
              with:
                  path: ~/.nuget/packages
                  key: ${{ runner.os }}-nuget-${{ hashFiles('api/**/*.csproj') }}
                  restore-keys: ${{ runner.os }}-nuget-

            - name: Restore
              working-directory: ./api
              run: dotnet restore

            - name: Build
              working-directory: ./api
              run: dotnet build --no-restore -c Release

            # İlk başta yorumda bırak, 'dotnet format' bir kez çalıştırdıktan sonra aç.
            - name: Format kontrolü
              working-directory: ./api
              run: dotnet format --verify-no-changes

            - name: Test
              working-directory: ./api
              run: >
                  dotnet test --no-build -c Release
                  --logger "trx;LogFileName=test-results.trx"
                  --collect:"XPlat Code Coverage"
                  --results-directory ./TestResults

            - name: Test sonuçlarını yükle
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: test-results
                  path: api/TestResults/
                  retention-days: 7
