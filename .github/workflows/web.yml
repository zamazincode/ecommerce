name: Web

on:
    push:
        branches: [main, develop]
        paths: ["web/**", ".github/workflows/web.yml"]
    pull_request:
        branches: [main, develop]
        paths: ["web/**", ".github/workflows/web.yml"]

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./web

        steps:
            - uses: actions/checkout@v4

            # Proje bun kullanıyor (web/bun.lock). npm değil — setup-node'un
            # "cache: npm" + package-lock.json araması burada patlar.
            - name: Bun kurulumu
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Bağımlılıklar
              run: bun install --frozen-lockfile

            - name: Lint
              run: bun run lint

            - name: Tip kontrolü
              run: bunx tsc --noEmit

            # Faz W1'de Vitest kurulup package.json'a "test" script'i eklenince
            # yorumu kaldır. Şimdi kaldırırsan script olmadığı için CI kırmızı olur.
            # - name: Birim testler
            #   run: bun run test -- --run

            - name: Build
              run: bun run build
              env:
                  NEXT_PUBLIC_API_URL: https://placeholder.invalid
